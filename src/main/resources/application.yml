server:
  port: 8080

spring:
  application:
    name: smart-ui-analysis

  # Database configuration: H2 by default, persisted to a local file
  datasource:
    url: jdbc:h2:file:./data/smartui;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Servlet multipart config to allow uploading larger screenshot files / PDFs
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 30MB

# To run with PostgreSQL, configure spring.profiles.active: postgres
# and set the configuration below:
