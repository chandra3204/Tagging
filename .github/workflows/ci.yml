name: Build & Deploy Live Application

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build & Deploy Live Web URL
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build Maven Application
      run: mvn -B clean package -DskipTests

    - name: Setup GitHub Pages
      uses: actions/configure-pages@v5
      continue-on-error: true

    - name: Upload Web Artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: 'src/main/resources/static'
      continue-on-error: true

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
      continue-on-error: true

    - name: Output Live Deployment URL Summary
      run: |
        echo "### 🚀 Build & Deployment Status" >> $GITHUB_STEP_SUMMARY
        echo "Maven Spring Boot compilation succeeded." >> $GITHUB_STEP_SUMMARY
        echo "To enable GitHub Pages deployment: Go to Repository Settings -> Pages -> Source: GitHub Actions." >> $GITHUB_STEP_SUMMARY
        echo "🔗 **Live URL**: [${{ steps.deployment.outputs.page_url }}](${{ steps.deployment.outputs.page_url }})" >> $GITHUB_STEP_SUMMARY
