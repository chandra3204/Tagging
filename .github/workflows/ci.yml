name: pages-build-deployment

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build Maven Application
      run: mvn -B clean package -DskipTests

    - name: Setup GitHub Pages
      uses: actions/configure-pages@v5

    - name: Upload Pages Artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: 'src/main/resources/static'

  report-build-status:
    name: report-build-status
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Print Build Status Summary
      run: |
        echo "### 🚀 Maven Build Status" >> $GITHUB_STEP_SUMMARY
        echo "Spring Boot project compilation & packaging completed successfully." >> $GITHUB_STEP_SUMMARY

  deploy:
    name: deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
