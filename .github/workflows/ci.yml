name: pages-build-deployment

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build Maven Application
      run: mvn -B clean package -DskipTests

    - name: Upload Pages Artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: 'src/main/resources/static'

  report-build-status:
    name: report-build-status
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Print Build & Deployment Summary
      run: |
        echo "### 🚀 Live Deployment URL" >> $GITHUB_STEP_SUMMARY
        echo "Spring Boot compilation completed successfully." >> $GITHUB_STEP_SUMMARY
        echo "🔗 **Live Web URL**: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" >> $GITHUB_STEP_SUMMARY

  deploy:
    name: deploy
    environment:
      name: github-pages
      url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
      continue-on-error: true

    - name: Output Deployment Link
      run: |
        echo "Deployed Live Web URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
